name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow calls this to test the exact tagged commit.
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "stable"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  go-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Must not be newer than the Go that built the pinned golangci-lint
          # (v2.10.1 is built with go1.26); a newer stdlib makes it panic.
          go-version: "1.26.x"
          cache-dependency-path: go/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.10.1
          working-directory: go

  readme-examples:
    name: README examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Builds every complete program in README.md, go/README.md, and
      # rust/README.md against the local source, as a user would paste it.
      - run: python3 scripts/check_readme_examples.py

  rust:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.88", "stable"]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - if: matrix.rust == 'stable'
        run: cargo fmt --check
      - if: matrix.rust == 'stable'
        run: cargo clippy --locked --all-targets -- -D warnings
      - if: matrix.rust == 'stable'
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
      # --locked fails if Cargo.lock is stale (e.g. a version bump without
      # updating it), which would otherwise break `cargo publish --locked`.
      - run: cargo test --locked
      - if: matrix.rust == 'stable'
        run: cargo publish --dry-run --locked
